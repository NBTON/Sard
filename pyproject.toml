[project]
name = "sard-mvp"
version = "0.2.0"
description = "Sard — Arabic-first travel planning assistant (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Provider-neutral LangChain core + orchestration + UI. No CHAT provider
    # SDK is a direct dependency here — those live in the optional groups
    # below and are only imported inside sard/config/models.py.
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.1",
    # Local, in-process vector database used by the RAG foundation (Step 3).
    # See README "Why Zvec" for the rationale.
    "zvec>=0.6.0",
    # Document parsing/ingestion utilities used by sard/rag/loaders.py.
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    # RFC 5545 calendar generation and parsing for the Step 6 renderer.
    "icalendar>=7.2.2,<8",
]

[project.optional-dependencies]
# Install only the provider(s) you intend to use.
anthropic = [
    "langchain-anthropic>=0.2.0",
]
openai = [
    "langchain-openai>=0.2.0",
]
# NVIDIA NIM: the only remote/self-hosted AI provider used by the RAG
# foundation (chat/query-rewrite, embeddings, reranking). Imported ONLY
# inside sard/config/rag.py, sard/rag/embeddings.py, sard/rag/rerank.py,
# and sard/rag/query_rewriter.py.
nvidia = [
    "langchain-nvidia-ai-endpoints>=1.4.3",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sard-rag = "sard.cli.rag:main"
sard-agent = "sard.cli.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in network-backed NVIDIA smoke tests",
]

[dependency-groups]
dev = [
    "pymupdf>=1.24.0",
]
