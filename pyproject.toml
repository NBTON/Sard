[project]
name = "sard-mvp"
version = "0.2.0"
description = "Sard — Arabic-first cultural and travel assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Provider-neutral LangChain core + orchestration + API.
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    # Local, in-process vector database used by the RAG foundation.
    "zvec>=0.6.0",
    # Document parsing/ingestion utilities used by sard/rag/loaders.py.
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.2.0",
    "pillow>=10.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    # RFC 5545 calendar generation and parsing for the Step 6 renderer.
    "icalendar>=7.2.2,<8",
    # Office presentation (PPTX) deck generation.
    "python-pptx>=1.0.2",
    "python-docx>=1.1.0",
    # Multipart form-data handling for file uploads.
    "python-multipart>=0.0.9",
    # Vercel Serverless & Blob Object Storage SDK
    "vercel>=0.10.0",
    "vercel-blob>=0.4.2",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.2.0",
]
openai = [
    "langchain-openai>=0.2.0",
]
nvidia = [
    "langchain-nvidia-ai-endpoints>=1.4.3",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyright>=1.1.411",
    "ruff>=0.16.6",
    "debugpy>=1.8.21",
]

[project.scripts]
sard-rag = "sard.cli.rag:main"
sard-agent = "sard.cli.agent:main"
sard-demo = "sard.cli.demo:main"
sard-api = "sard.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in network-backed NVIDIA smoke tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "node_modules", ".next", "output", "tmp", "data/zvec"]

[tool.ruff.lint]
# Phased rollout (reviewable groups first): unused imports/variables (F401/F841)
# and swallowed exceptions (S110 try-except-pass, S112 try-except-continue).
# Broad-except (BLE001) triage + TRY/B + pyupgrade/isort are tracked follow-ups
# (see README limitations) to avoid a 1500-line unrelated diff.
select = ["F401", "F841", "S110", "S112"]
ignore = []

[tool.ruff.lint.flake8-bandit]
hardcoded-tmp-directory = ["/tmp"]

[dependency-groups]
dev = [
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
]
