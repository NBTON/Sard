[project]
name = "sard-mvp"
version = "0.2.0"
description = "Sard — Arabic-first cultural and travel assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Provider-neutral LangChain core + orchestration + API.
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    # Local, in-process vector database used by the RAG foundation.
    "zvec>=0.6.0",
    # Document parsing/ingestion utilities used by sard/rag/loaders.py.
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    # RFC 5545 calendar generation and parsing for the Step 6 renderer.
    "icalendar>=7.2.2,<8",
    # Office presentation (PPTX) deck generation.
    "python-pptx>=1.0.2",
    # Multipart form-data handling for file uploads.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.2.0",
]
openai = [
    "langchain-openai>=0.2.0",
]
nvidia = [
    "langchain-nvidia-ai-endpoints>=1.4.3",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sard-rag = "sard.cli.rag:main"
sard-agent = "sard.cli.agent:main"
sard-demo = "sard.cli.demo:main"
sard-api = "sard.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in network-backed NVIDIA smoke tests",
]

[dependency-groups]
dev = [
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
]
